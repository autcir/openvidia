name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # Runner self-hosted su soliso: i job hosted richiedono minuti GitHub Actions
    # e l'account è bloccato per billing — il self-hosted ne è immune.
    runs-on: [self-hosted, soliso, openvidia]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Prefer the hand-written CHANGELOG entry when one exists for this tag;
      # fall back to the commit log so a release is never empty.
      - name: Build release notes
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [ -f CHANGELOG.md ] && grep -q "^## \[${version}\]" CHANGELOG.md; then
            awk -v v="$version" '
              $0 ~ "^## \\["v"\\]" {f=1; next}
              f && /^## \[/ {exit}
              f {print}
            ' CHANGELOG.md > notes.md
          else
            prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              git log --pretty='- %s' "${prev}..${tag}" > notes.md
            else
              git log --pretty='- %s' > notes.md
            fi
          fi
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          draft: false

  pypi:
    # Trusted Publishing: PyPI trusts this workflow through OIDC, so no API
    # token is stored anywhere. It needs a one-time "trusted publisher" entry
    # on pypi.org for autcir/openvidia, workflow release.yml, environment pypi.
    name: Publish to PyPI
    needs: release
    runs-on: [self-hosted, soliso, openvidia]
    environment:
      name: pypi
      url: https://pypi.org/project/openvidia/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist and wheel
        run: uv build

      - name: Publish
        run: uv publish --trusted-publishing always
