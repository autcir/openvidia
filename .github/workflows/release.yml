name: Release

on:
  push:
    tags:
      - "v*"

# Every action in this file is pinned to a full commit SHA: these jobs hold
# contents:write and an OIDC token that can publish to PyPI, so a moved tag
# must not be able to run new code here. Dependabot bumps the SHA and the
# version comment together.
permissions:
  contents: write

jobs:
  release:
    # Self-hosted runner on soliso: hosted jobs need GitHub Actions minutes and
    # the account is locked for billing — the self-hosted runner is immune.
    runs-on: [self-hosted, soliso, openvidia]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Prefer the hand-written CHANGELOG entry when one exists for this tag;
      # fall back to the commit log so a release is never empty.
      - name: Build release notes
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [ -f CHANGELOG.md ] && grep -q "^## \[${version}\]" CHANGELOG.md; then
            awk -v v="$version" '
              $0 ~ "^## \\["v"\\]" {f=1; next}
              f && /^## \[/ {exit}
              f {print}
            ' CHANGELOG.md > notes.md
          else
            prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              git log --pretty='- %s' "${prev}..${tag}" > notes.md
            else
              git log --pretty='- %s' > notes.md
            fi
          fi
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          draft: false

  build:
    # Build in a job WITHOUT the OIDC token, so the code that runs during the
    # build (setuptools, the project's own build hooks) never holds a
    # credential that can publish.
    name: Build sdist and wheel
    runs-on: [self-hosted, soliso, openvidia]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    # Trusted Publishing: PyPI trusts this workflow through OIDC, so no API
    # token is stored anywhere. It needs a one-time "trusted publisher" entry
    # on pypi.org for autcir/openvidia, workflow release.yml, environment pypi.
    # This job checks out no code: it only uploads the artifacts built above.
    name: Publish to PyPI
    needs: [release, build]
    runs-on: [self-hosted, soliso, openvidia]
    environment:
      name: pypi
      url: https://pypi.org/project/openvidia/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Publish
        run: uv publish --trusted-publishing always dist/*
