name: Model catalog

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - openvidia/config.py
      - openvidia/compaction.py
      - scripts/check_catalog.py
      - .github/workflows/catalog.yml

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    # Public fork code must not execute with the persistent runner's credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Shipped model ids still served
    runs-on: [self-hosted, soliso, autcir, openvidia]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Compare tuning against live catalog
        run: uv run python -m scripts.check_catalog
      - name: Publish catalog status
        if: always()
        run: |
          if [ -f catalog-report.json ]; then
            {
              printf '### Live catalog check\n```json\n'
              cat catalog-report.json
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Catalog check did not finish. Inspect the failed step.' >> "$GITHUB_STEP_SUMMARY"
          fi
