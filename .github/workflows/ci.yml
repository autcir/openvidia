name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Public fork code must not execute with the persistent runner's credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Pytest (Python ${{ matrix.python }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    runs-on: [self-hosted, soliso, autcir, openvidia]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # `uv sync` resolves from pyproject + uv.lock, so CI runs the same
      # versions as a developer's machine. The previous job pip-installed a
      # hand-written list (pytest pytest-asyncio httpx fastapi psutil) which
      # omitted uvicorn and tomlkit and passed only because nothing imported
      # them at module scope — the first test to touch server_manager would
      # have failed for a reason that had nothing to do with the change.
      - name: Sync dependencies
        run: uv sync --frozen --python "${{ matrix.python }}"

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Dashboard behavior
        run: node --test tests/dashboard.test.cjs

  lint:
    # Public fork code must not execute with the persistent runner's credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Ruff
    timeout-minutes: 10
    runs-on: [self-hosted, soliso, autcir, openvidia]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check openvidia/ tests/ scripts/

      - name: Format check
        run: uv run ruff format --check openvidia/ tests/ scripts/

  package:
    # Public fork code must not execute with the persistent runner's credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Wheel installs and serves
    timeout-minutes: 15
    runs-on: [self-hosted, soliso, autcir, openvidia]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # An editable install runs from the source tree, so it cannot tell you
      # whether the wheel is complete. It was not: the dashboard bundle lived
      # outside the package for two releases, and every real install shipped a
      # proxy with no UI and no /health. This job builds the artifact users
      # actually get, installs it elsewhere, and checks it.
      - name: Build the wheel
        run: uv build --wheel

      - name: Install it into a clean environment
        run: |
          uv venv /tmp/ov-pkg-check
          uv pip install --python /tmp/ov-pkg-check/bin/python dist/*.whl

      - name: The dashboard bundle shipped
        run: |
          /tmp/ov-pkg-check/bin/python - <<'PY'
          import pathlib, openvidia
          web = pathlib.Path(openvidia.__file__).parent / "web"
          assert web.is_dir(), f"{web} is not in the wheel"
          missing = [n for n in ("index.html", "main.js", "styles.css") if not (web / n).is_file()]
          assert not missing, f"missing from the wheel: {missing}"
          print("dashboard bundle OK:", web)
          PY

      - name: The entry point runs without desktop packages
        run: |
          cd /tmp
          /tmp/ov-pkg-check/bin/openvidia --help
          /tmp/ov-pkg-check/bin/python -c 'import importlib.util; assert importlib.util.find_spec("PyQt6") is None'


      - name: Installed wheel serves health
        run: |
          cd /tmp
          /tmp/ov-pkg-check/bin/python - <<'PYCODE'
          import asyncio, pathlib, tempfile
          import httpx, openvidia
          from openvidia import config
          from openvidia.proxy_app import create_app
          from openvidia.proxy_state import ProxyState, ProxyStats
          async def check():
              with tempfile.TemporaryDirectory() as directory:
                  config.config_dir = lambda: pathlib.Path(directory)
                  app = create_app(ProxyState([], ProxyStats(), log_cb=lambda _: None))
                  async with httpx.AsyncClient(transport=httpx.ASGITransport(app), base_url="http://localhost:1919") as client:
                      response = await client.get("/health")
                      assert response.status_code == 200 and response.json()["service"] == "openvidia"
          asyncio.run(check())
          PYCODE

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/ov-pkg-check

  shell:
    # Public fork code must not execute with the persistent runner's credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Shellcheck
    timeout-minutes: 5
    runs-on: [self-hosted, soliso, autcir, openvidia]

    steps:
      - uses: actions/checkout@v7

      # Every tracked shell script, not a hand-written list: the list named
      # openvidia-launcher.sh, which no longer exists, and the job only passed
      # because shellcheck was missing on the runner and the step skipped
      # itself. shellcheck is now installed on soliso, so a missing binary is
      # an error, not a pass.
      - name: Check every shell script
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck
