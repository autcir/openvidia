name: Deploy to Soliso

# Triggered by CI finishing, not by the push itself. As a `push` workflow this
# ran in PARALLEL with CI, so a commit with failing tests was deployed anyway —
# `needs:` cannot reference jobs in another workflow file, which is presumably
# why the gate was missing. The `conclusion == success` check below is what
# actually enforces it: workflow_run fires on failure too.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-soliso
  cancel-in-progress: false

jobs:
  deploy:
    name: Update & Restart
    runs-on: [self-hosted, soliso, autcir, openvidia]
    timeout-minutes: 15
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      # soliso runs the proxy as an editable install out of
      # ~/.local/share/openvidia (venv in ~/.local/share/openvidia-venv), which
      # is what openvidia.service starts — so the deploy is a fast-forward of
      # that checkout, not a system-wide install. `uv pip install --system`
      # wrote to /usr/lib/python*/site-packages as an unprivileged runner and
      # failed with EACCES; the paths after that pointed at ~/apps/openvidia,
      # which does not exist on soliso.
      - name: Update the hub checkout
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cd ~/.local/share/openvidia
          git fetch --depth 1 origin "$HEAD_SHA"
          git reset --hard FETCH_HEAD
          git log --oneline -1
          VIRTUAL_ENV="$HOME/.local/share/openvidia-venv" uv pip install -q -e .

      # The unit is a systemd *user* unit. The old step probed it with
      # `systemctl list-unit-files`, which only sees system units, so it always
      # reported "not installed here", exited 0 and restarted nothing — a green
      # deploy that never deployed. `--user` needs XDG_RUNTIME_DIR, which the
      # runner's non-login shell does not set.
      - name: Restart the proxy
        run: |
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          systemctl --user restart openvidia.service
          systemctl --user is-active --quiet openvidia.service

      # is-active only says the process survived. The proxy binds its socket
      # after loading the key pool, so a config that kills it on startup still
      # looks active for a moment — wait for the port to actually answer.
      - name: Verify it is serving
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null -m 5 "http://localhost:1919/api/status" \
               -H "x-openvidia-token: $(cat ~/.config/openvidia/control_token)"; then
              echo "proxy is serving"
              exit 0
            fi
            sleep 2
          done
          echo "::error::proxy did not answer on :1919 within 40s"
          exit 1
