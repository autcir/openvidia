name: Bug report
description: The proxy, a shim or the dashboard does something wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - opencode
        - Codex CLI (/v1/responses)
        - Claude Code (/v1/messages)
        - Grok
        - Jcode
        - Other OpenAI-compatible client
        - Dashboard only
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model id
      placeholder: z-ai/glm-5.3
  - type: textarea
    id: log
    attributes:
      label: Activity log
      description: The relevant lines from the dashboard Activity log. Remove API keys first.
      render: text
  - type: input
    id: version
    attributes:
      label: OpenVidia version and OS
      placeholder: 2.2.0, Ubuntu 24.04, Python 3.12
    validations:
      required: true
